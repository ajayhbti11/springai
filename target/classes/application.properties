spring.application.name=openai
spring.main.web-application-type=servlet
spring.ai.openai.chat.options.stream=false
spring.ai.ollama.base-url=http://localhost:11434
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.embedding.enabled=false
spring.ai.chat.client.enabled=false

spring.datasource.url=jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=ajay
spring.datasource.password=12345

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/schema/schema-h2db.sql


spring.docker.compose.stop.command=down

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=springai
